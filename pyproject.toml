[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocap-capture"
version = "0.1.0.dev0"
description = "P1 + P2 on the recorder PC: cameras, takes, sync markers, hand-off"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mocap-contracts[zmq] @ git+https://github.com/rafaelchiafarelli/mocap-contracts.git@v0.2.1",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mocap-capture = "mocap_capture.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mocap_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
